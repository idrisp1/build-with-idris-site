<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a24"/>
      <stop offset="45%" stop-color="#1f1035"/>
      <stop offset="100%" stop-color="#08050f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#8654c9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8654c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#522398" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#522398" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9aef2"/>
      <stop offset="100%" stop-color="#7c4fd4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#glow1)"/>
  <rect width="1600" height="500" fill="url(#glow2)"/>

  <!-- faint dot grid texture -->
  <g fill="#ffffff" opacity="0.05">
    <g id="dotrow">
      <circle cx="20" cy="20" r="1.4"/><circle cx="60" cy="20" r="1.4"/><circle cx="100" cy="20" r="1.4"/>
      <circle cx="140" cy="20" r="1.4"/><circle cx="180" cy="20" r="1.4"/><circle cx="220" cy="20" r="1.4"/>
      <circle cx="260" cy="20" r="1.4"/><circle cx="300" cy="20" r="1.4"/><circle cx="340" cy="20" r="1.4"/>
      <circle cx="380" cy="20" r="1.4"/><circle cx="420" cy="20" r="1.4"/><circle cx="460" cy="20" r="1.4"/>
      <circle cx="500" cy="20" r="1.4"/><circle cx="540" cy="20" r="1.4"/><circle cx="580" cy="20" r="1.4"/>
      <circle cx="620" cy="20" r="1.4"/><circle cx="660" cy="20" r="1.4"/><circle cx="700" cy="20" r="1.4"/>
      <circle cx="740" cy="20" r="1.4"/><circle cx="780" cy="20" r="1.4"/><circle cx="820" cy="20" r="1.4"/>
      <circle cx="860" cy="20" r="1.4"/><circle cx="900" cy="20" r="1.4"/><circle cx="940" cy="20" r="1.4"/>
      <circle cx="980" cy="20" r="1.4"/><circle cx="1020" cy="20" r="1.4"/><circle cx="1060" cy="20" r="1.4"/>
      <circle cx="1100" cy="20" r="1.4"/><circle cx="1140" cy="20" r="1.4"/><circle cx="1180" cy="20" r="1.4"/>
      <circle cx="1220" cy="20" r="1.4"/><circle cx="1260" cy="20" r="1.4"/><circle cx="1300" cy="20" r="1.4"/>
      <circle cx="1340" cy="20" r="1.4"/><circle cx="1380" cy="20" r="1.4"/><circle cx="1420" cy="20" r="1.4"/>
      <circle cx="1460" cy="20" r="1.4"/><circle cx="1500" cy="20" r="1.4"/><circle cx="1540" cy="20" r="1.4"/>
      <circle cx="1580" cy="20" r="1.4"/>
    </g>
    <use href="#dotrow" y="40"/><use href="#dotrow" y="80"/><use href="#dotrow" y="120"/>
    <use href="#dotrow" y="160"/><use href="#dotrow" y="200"/><use href="#dotrow" y="240"/>
    <use href="#dotrow" y="280"/><use href="#dotrow" y="320"/><use href="#dotrow" y="360"/>
    <use href="#dotrow" y="400"/><use href="#dotrow" y="440"/><use href="#dotrow" y="480"/>
  </g>

  <!-- abstract graduation cap glyphs, tossed upward, celebratory but non-photographic -->
  <g id="cap" fill="none" stroke="url(#capStroke)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M -34 0 L 0 -14 L 34 0 L 0 14 Z"/>
    <rect x="-13" y="6" width="26" height="16" rx="2"/>
    <line x1="30" y1="-4" x2="30" y2="20"/>
    <circle cx="30" cy="23" r="3"/>
  </g>

  <g opacity="0.85"><use href="#cap" transform="translate(180,120) scale(0.9) rotate(-12)"/></g>
  <g opacity="0.6"><use href="#cap" transform="translate(430,70) scale(0.6) rotate(18)"/></g>
  <g opacity="0.5"><use href="#cap" transform="translate(700,160) scale(0.75) rotate(-6)"/></g>
  <g opacity="0.4"><use href="#cap" transform="translate(980,90) scale(0.55) rotate(24)"/></g>
  <g opacity="0.7"><use href="#cap" transform="translate(1230,140) scale(0.85) rotate(-20)"/></g>
  <g opacity="0.35"><use href="#cap" transform="translate(1440,60) scale(0.5) rotate(10)"/></g>
  <g opacity="0.3"><use href="#cap" transform="translate(80,230) scale(0.45) rotate(30)"/></g>
  <g opacity="0.3"><use href="#cap" transform="translate(1550,220) scale(0.5) rotate(-16)"/></g>

  <!-- soft upward motion trails -->
  <g stroke="#9d76e8" stroke-width="1.5" opacity="0.22" fill="none" stroke-linecap="round">
    <path d="M 200 500 C 190 320, 190 200, 180 130"/>
    <path d="M 720 500 C 710 340, 705 240, 700 165"/>
    <path d="M 1250 500 C 1240 330, 1235 220, 1230 145"/>
  </g>
</svg>
